# Render Blueprint for the Calorie Tracker frontend (static site).
#
# NOTE: Render does NOT auto-apply this to a static site you created manually in the
# dashboard. To use it, create the service from this file via "New + -> Blueprint".
# The `name` below MUST match your existing service name, or Render spins up a
# second, duplicate site instead of updating the current one.
#
# If you'd rather keep the current dashboard-managed service, skip the Blueprint and
# just add the `headers` entries below under Settings -> Headers in the dashboard.
services:
  - type: web
    name: calorie-tracker # <-- change to match your existing Render service name
    runtime: static
    rootDir: frontend # Root Directory is `frontend` (monorepo); paths below are relative to it.
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/frontend/browser
    headers:
      # Never cache the service worker or its manifest — these gate every update.
      - path: /ngsw-worker.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /ngsw.json
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /safety-worker.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /worker-basic.min.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      # App shell + manifest: always revalidate so a new deploy is seen immediately.
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
      - path: /manifest.webmanifest
        name: Cache-Control
        value: "no-cache"
      # Content-hashed bundles never change under the same name — cache aggressively.
      - path: /*.js
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*.css
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      # SPA fallback so deep links resolve to the Angular app shell.
      - type: rewrite
        source: /*
        destination: /index.html
